<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTF Is This</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: oklch(100% 0 0);
    --bg-alt: oklch(96% 0.008 95);
    --bg-card: oklch(93% 0.009 95);
    --line: oklch(20% 0.01 95 / 0.12);
    --line-strong: oklch(15% 0.01 95);
    --fg: oklch(16% 0.012 95);
    --fg-muted: oklch(38% 0.02 95);
    --fg-dim: oklch(48% 0.02 95);
    --accent: oklch(62% 0.20 35);
    --accent-text: oklch(46% 0.19 30);
    --accent-ink: oklch(12% 0.01 255);
    --cat-gaming: oklch(66% 0.19 300);
    --cat-gaming-text: oklch(46% 0.17 300);
    --cat-sports: oklch(70% 0.18 150);
    --cat-sports-text: oklch(40% 0.15 150);
    --cat-politics: oklch(62% 0.20 35);
    --cat-politics-text: oklch(46% 0.19 30);
    --cat-tech: oklch(70% 0.13 230);
    --cat-tech-text: oklch(44% 0.13 230);
    --cat-general: oklch(68% 0.12 195);
    --cat-general-text: oklch(42% 0.11 195);
    --cat-misc: oklch(78% 0.16 90);
    --cat-misc-text: oklch(46% 0.14 90);
    --cat-entertainment: oklch(66% 0.19 320);
    --cat-entertainment-text: oklch(46% 0.18 320);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Work Sans', system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }
  .headline { font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; line-height: 0.96; margin: 0; text-transform: uppercase; text-wrap: balance; }
  .dek { font-weight: 500; color: var(--fg-muted); line-height: 1.45; margin: 0; }
  .byline { font-weight: 600; font-size: 12px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--fg-dim); margin: 0; font-variant-numeric: tabular-nums; }
  .chip { font-weight: 800; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent-ink); padding: 5px 10px; display: inline-block; width: fit-content; }
  .eyebrow { font-weight: 800; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .section-title { font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; text-transform: uppercase; margin: 0; }
  .see-all { font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-muted); }
  .nav-link { font-weight: 700; font-size: 15px; letter-spacing: 0.03em; text-transform: uppercase; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
  .img-ph { position: relative; overflow: hidden; background-color: var(--bg-card); }
  .img-ph svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.55; }
  .img-ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .page { max-width: 1440px; margin: 0 auto; padding-bottom: 64px; }
  .utility-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px clamp(20px, 4vw, 48px); border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 8px; }
  .masthead { display: flex; flex-direction: column; align-items: center; padding: 32px clamp(20px, 4vw, 48px) 0; }
  .wordmark { font-size: clamp(40px, 6vw, 76px); text-align: center; }
  .nav-row { display: flex; align-items: center; gap: clamp(16px, 3vw, 36px); padding: 18px 0 16px; flex-wrap: wrap; justify-content: center; }
  .hero { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; padding: 44px clamp(20px, 4vw, 48px); }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .trending { background: var(--bg-alt); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 22px clamp(20px, 4vw, 48px); display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }
  .category-section { padding: 56px clamp(20px, 4vw, 48px) 0; }
  .category-header { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 14px; margin-bottom: 32px; }
  .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
  @media (max-width: 860px) { .card-grid { grid-template-columns: 1fr; } }
  .card { display: flex; flex-direction: column; gap: 12px; }
  .footer { margin-top: 80px; border-top: 2px solid var(--line-strong); padding: 40px clamp(20px, 4vw, 48px); display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 32px; }
  .footer-links { display: flex; gap: 64px; flex-wrap: wrap; }
  .footer-col { display: flex; flex-direction: column; gap: 10px; }
  .card-link { cursor: pointer; }
  .card-link:hover .headline { color: var(--accent-text); }
  .admin-wrap { max-width: 760px; margin: 0 auto; padding: 44px clamp(20px, 4vw, 48px) 0; }
  .btn { display: inline-block; border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase; padding: 12px 22px; border-radius: 999px; }
  .btn-primary { background: var(--fg); color: var(--bg); }
  .btn-outline { background: transparent; color: var(--fg); border: 1px solid var(--line-strong); }
  .btn-danger { background: var(--accent-text); color: #fff; }
  .btn-small { padding: 8px 16px; font-size: 11px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .admin-list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); gap: 16px; flex-wrap: wrap; }
  .admin-list-item .meta { display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
  .admin-list-item .actions { display: flex; gap: 10px; align-items: center; }
  .admin-form label { display: block; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-dim); margin-bottom: 6px; }
  .admin-form input[type=text], .admin-form input[type=email], .admin-form input[type=password], .admin-form textarea, .admin-form select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 6px; font: inherit; font-size: 15px; background: var(--bg); color: var(--fg); margin-bottom: 20px;
  }
  .admin-form textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
  .admin-form .field-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .admin-form .hint { font-size: 12px; color: var(--fg-dim); margin: -14px 0 20px; }
  .publish-status { font-size: 13px; color: var(--fg-muted); margin-top: 12px; min-height: 18px; }
  .error-status { font-size: 13px; color: var(--accent-text); margin-top: 12px; min-height: 18px; }
  .delete-confirm { background: var(--bg-alt); border: 1px solid var(--line-strong); border-radius: 8px; padding: 16px; margin-top: 12px; }
  .article-body p { font-size: 18px; line-height: 1.7; color: var(--fg); margin: 0; }
  .tldr-box { background: var(--bg-alt); border-left: 4px solid var(--accent-text); border-radius: 4px; padding: 20px 24px; font-size: 18px; line-height: 1.6; color: var(--fg); }
</style>
</head>
<body>

<div class="page">

  <div class="utility-bar">
    <div class="eyebrow" style="color:var(--fg-dim);">WTF IS THIS &mdash; NOBODY ASKED, WE'RE TELLING YOU ANYWAY</div>
    <div style="display:flex; align-items:center; gap:28px;" id="utility-right"></div>
  </div>

  <div class="masthead">
    <a href="#home" style="display:block; text-decoration:none; color:inherit;"><h1 class="headline wordmark"><span style="color:var(--accent-text);">WTF</span> IS THIS</h1></a>
    <div class="nav-row" id="nav-row">
      <a href="#home" class="nav-link">Home</a>
    </div>
  </div>
  <div style="height:3px; background:var(--line-strong); margin:0 clamp(20px, 4vw, 48px);"></div>

  <div id="app"></div>

  <div class="footer">
    <div style="display:flex; flex-direction:column; gap:10px;">
      <h3 class="headline" style="font-size:26px;"><span style="color:var(--accent-text);">WTF</span> IS THIS</h3>
      <p class="byline" style="color:var(--fg-dim);">&copy; 2026 WTF IS THIS MEDIA. WE'RE NOT SORRY.</p>
      <button class="nav-link" id="nav-auth-link" style="font-size:11px; color:var(--fg-dim); margin-top:4px;">Don't click this.</button>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  // ---- 1. PASTE YOUR FIREBASE CONFIG HERE (from Firebase console > Project settings > General > Your apps) ----
  const firebaseConfig = {
    apiKey: "AIzaSyARrJn8JZ06Sxi6LxIQ3PG0L5Om94Om7Xo",
    authDomain: "wtf-is-this-57d1f.firebaseapp.com",
    projectId: "wtf-is-this-57d1f",
    storageBucket: "wtf-is-this-57d1f.firebasestorage.app",
    messagingSenderId: "375753434281",
    appId: "1:375753434281:web:3ecb2fd0026e57b31635b8"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var CAT_LABEL = { gaming: 'Gaming', sports: 'Sports', politics: 'Politics', tech: 'Tech', general: 'General', misc: 'Miscellaneous', entertainment: 'Entertainment' };
  var CATS = ['gaming', 'sports', 'politics', 'tech', 'general', 'misc', 'entertainment'];

  var ARTICLES = [];
  var HERO_ID = null;
  var currentUser = null;
  var editingId = null;
  var pendingDeleteId = null;
  var loading = true;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function placeholderSvg(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="var(--fg-dim)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>';
  }

  var POSITION_CSS = { center: '50% 50%', top: '50% 0%', bottom: '50% 100%', left: '0% 50%', right: '100% 50%' };
  var POSITION_LABEL = { center: 'Center', top: 'Top', bottom: 'Bottom', left: 'Left', right: 'Right' };

  function mediaHtml(a, size) {
    if (a.image) {
      var pos = POSITION_CSS[a.imagePosition] || POSITION_CSS.center;
      return '<img src="' + esc(a.image) + '" alt="" style="object-position:' + pos + ';">';
    }
    return placeholderSvg(size);
  }

  function findArticle(id) {
    for (var i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) return ARTICLES[i];
    return null;
  }

  function heroArticle() {
    return (HERO_ID && findArticle(HERO_ID)) || ARTICLES[0] || null;
  }

  function heroCardHtml(a) {
    return '' +
      '<a class="card card-link" href="#article-' + esc(a.id) + '">' +
        '<div class="img-ph" style="width:100%; height:460px;">' + mediaHtml(a, 40) + '</div>' +
        '<div class="chip" style="background:var(--cat-' + a.category + ');">' + CAT_LABEL[a.category] + '</div>' +
        '<h2 class="headline" style="font-size:clamp(30px, 3.4vw, 46px);">' + esc(a.headline) + '</h2>' +
        (a.dek ? '<p class="dek" style="font-size:18px; max-width:640px;">' + esc(a.dek) + '</p>' : '') +
        '<p class="byline">' + esc(a.byline) + ' &middot; ' + esc(a.readTime) + '</p>' +
      '</a>';
  }

  function secondaryCardHtml(a) {
    return '' +
      '<a class="card card-link" href="#article-' + esc(a.id) + '">' +
        '<div class="img-ph" style="width:100%; height:200px;">' + mediaHtml(a, 40) + '</div>' +
        '<div class="chip" style="background:var(--cat-' + a.category + ');">' + CAT_LABEL[a.category] + '</div>' +
        '<h3 class="headline" style="font-size:24px;">' + esc(a.headline) + '</h3>' +
        '<p class="byline">' + esc(a.byline) + ' &middot; ' + esc(a.readTime) + '</p>' +
      '</a>';
  }

  function gridCardHtml(a) {
    return '' +
      '<a class="card card-link" href="#article-' + esc(a.id) + '">' +
        '<div class="img-ph" style="width:100%; height:220px;">' + mediaHtml(a, 36) + '</div>' +
        '<div class="chip" style="background:var(--cat-' + a.category + ');">' + CAT_LABEL[a.category] + '</div>' +
        '<h3 class="headline" style="font-size:22px;">' + esc(a.headline) + '</h3>' +
        '<p class="byline">' + esc(a.byline) + ' &middot; ' + esc(a.readTime) + '</p>' +
      '</a>';
  }

  function categorySectionHtml(cat) {
    var items = ARTICLES.filter(function (a) { return a.category === cat; }).slice(0, 3);
    if (items.length === 0) return '';
    return '' +
      '<div class="category-section">' +
        '<div class="category-header" style="border-bottom:3px solid var(--cat-' + cat + ');">' +
          '<h2 class="section-title" style="font-size:34px; color:var(--cat-' + cat + '-text);">' + CAT_LABEL[cat] + '</h2>' +
          '<a href="#category-' + cat + '" class="see-all">See All &rarr;</a>' +
        '</div>' +
        '<div class="card-grid">' + items.map(gridCardHtml).join('') + '</div>' +
      '</div>';
  }

  function categoryPageHtml(cat) {
    var items = ARTICLES.filter(function (a) { return a.category === cat; });
    return '' +
      '<div class="category-section" style="padding-top:44px;">' +
        '<div class="category-header" style="border-bottom:3px solid var(--cat-' + cat + ');">' +
          '<h2 class="section-title" style="font-size:34px; color:var(--cat-' + cat + '-text);">' + CAT_LABEL[cat] + '</h2>' +
        '</div>' +
        (items.length === 0
          ? '<p class="dek">No articles in this category yet.</p>'
          : '<div class="card-grid">' + items.map(gridCardHtml).join('') + '</div>') +
      '</div>';
  }

  function homeHtml() {
    if (loading) return '<div class="admin-wrap"><p class="dek">Loading&hellip;</p></div>';
    var hero = heroArticle();
    if (!hero) return '<div class="admin-wrap"><p class="dek">No articles yet.' + (currentUser ? ' <a href="#admin" style="color:var(--accent-text); text-decoration:underline;">Add one</a>.' : '') + '</p></div>';
    var secondaries = ARTICLES.filter(function (a) { return a.id !== hero.id; }).slice(0, 2);
    return '' +
      '<div class="hero">' +
        heroCardHtml(hero) +
        '<div style="display:flex; flex-direction:column; gap:28px;">' +
          secondaries.map(function (a, i) {
            return (i > 0 ? '<div style="height:1px; background:var(--line);"></div>' : '') + secondaryCardHtml(a);
          }).join('') +
        '</div>' +
      '</div>' +
      CATS.map(categorySectionHtml).join('');
  }

  function articleHtml(a) {
    return '' +
      '<div class="admin-wrap">' +
        '<a href="#home" class="see-all" style="display:inline-block; margin-bottom:24px;">&larr; Back to the Feed</a>' +
        '<div class="chip" style="background:var(--cat-' + a.category + ');">' + CAT_LABEL[a.category] + '</div>' +
        '<h1 class="headline" style="font-size:clamp(32px, 4.2vw, 52px); margin-top:16px;">' + esc(a.headline) + '</h1>' +
        (a.dek ? '<p class="dek" style="font-size:19px; margin-top:16px;">' + esc(a.dek) + '</p>' : '') +
        '<p class="byline" style="margin-top:16px;">' + esc(a.byline) + ' &middot; ' + esc(a.date) + ' &middot; ' + esc(a.readTime) + '</p>' +
      '</div>' +
      (a.image ? '<div class="img-ph" style="width:100%; height:520px; margin-top:32px;">' + mediaHtml(a, 40) + '</div>' : '') +
      (a.tldr ? '<div class="admin-wrap" style="padding-top:32px;"><div class="tldr-box"><strong>Well, WTF is this?:</strong> ' + esc(a.tldr) + '</div></div>' : '') +
      '<div class="admin-wrap article-body" style="display:flex; flex-direction:column; gap:22px; padding-top:' + (a.tldr ? '24px' : (a.image ? '40px' : '32px')) + ';">' +
        a.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
      '</div>';
  }

  function notFoundHtml() {
    return '<div class="admin-wrap"><h1 class="headline" style="font-size:40px;">Can\'t find that one.</h1><p class="dek" style="margin-top:12px;"><a href="#home" style="color:var(--accent-text); text-decoration:underline;">Back to the feed</a></p></div>';
  }

  function loginHtml() {
    return '' +
      '<div class="admin-wrap" style="max-width:420px;">' +
        '<h1 class="headline" style="font-size:32px; margin-bottom:20px;">Editor Log In</h1>' +
        '<form class="admin-form" id="login-form">' +
          '<label>Email</label><input type="email" name="email" required>' +
          '<label>Password</label><input type="password" name="password" required>' +
          '<button type="submit" class="btn btn-primary">Log In</button>' +
          '<div class="error-status" id="login-error"></div>' +
        '</form>' +
      '</div>';
  }

  function adminListHtml() {
    return ARTICLES.map(function (a) {
      var confirmBlock = pendingDeleteId === a.id ? (
        '<div class="delete-confirm">Delete &ldquo;' + esc(a.headline) + '&rdquo;? This can\'t be undone.' +
        '<div style="margin-top:10px; display:flex; gap:10px;">' +
          '<button class="btn btn-danger btn-small" onclick="WTF.deleteConfirm()">Delete It</button>' +
          '<button class="btn btn-outline btn-small" onclick="WTF.deleteCancel()">Cancel</button>' +
        '</div></div>'
      ) : '';
      return '' +
        '<div class="admin-list-item">' +
          '<div class="meta">' +
            '<span class="chip" style="background:var(--cat-' + a.category + '); width:fit-content;">' + CAT_LABEL[a.category] + (a.id === HERO_ID ? ' &middot; HERO' : '') + '</span>' +
            '<strong style="font-size:15px;">' + esc(a.headline) + '</strong>' +
            '<span class="byline">' + esc(a.byline) + '</span>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn btn-outline btn-small" onclick="WTF.startEdit(\'' + a.id + '\')">Edit</button>' +
            '<button class="btn btn-outline btn-small" onclick="WTF.deleteRequest(\'' + a.id + '\')">Delete</button>' +
          '</div>' +
          confirmBlock +
        '</div>';
    }).join('');
  }

  function adminFormHtml() {
    var editing = editingId ? findArticle(editingId) : null;
    var title = editing ? 'Edit Article' : 'New Article';
    return '' +
      '<h2 class="section-title" style="font-size:28px; margin-bottom:20px;">' + title + '</h2>' +
      '<form class="admin-form" id="article-form">' +
        '<label>Headline</label>' +
        '<input type="text" name="headline" value="' + (editing ? esc(editing.headline) : '') + '" required>' +
        '<label>Dek (optional subhead)</label>' +
        '<input type="text" name="dek" value="' + (editing ? esc(editing.dek) : '') + '">' +
        '<label>Byline</label>' +
        '<input type="text" name="byline" value="' + (editing ? esc(editing.byline) : '') + '" placeholder="By Your Name" required>' +
        '<label>Category</label>' +
        '<select name="category">' +
          CATS.map(function (c) {
            return '<option value="' + c + '"' + (editing && editing.category === c ? ' selected' : '') + '>' + CAT_LABEL[c] + '</option>';
          }).join('') +
        '</select>' +
        '<div class="field-row">' +
          '<input type="checkbox" id="hero-check" name="hero"' + (editing && editing.id === HERO_ID ? ' checked' : '') + '>' +
          '<label for="hero-check" style="margin:0;">Make this the main hero story</label>' +
        '</div>' +
        '<label>Image</label>' +
        '<input type="file" name="image" accept="image/*">' +
        (editing ? '<div class="hint">Leave blank to keep the current image. Keep new images under ~500KB.</div>' : '<div class="hint">Optional &mdash; leave blank to use a placeholder. Keep images under ~500KB.</div>') +
        '<label>Image Position</label>' +
        '<select name="imagePosition">' +
          Object.keys(POSITION_LABEL).map(function (p) {
            return '<option value="' + p + '"' + (editing && (editing.imagePosition || 'center') === p ? ' selected' : '') + '>' + POSITION_LABEL[p] + '</option>';
          }).join('') +
        '</select>' +
        '<div class="hint">Which part of the photo stays in frame if it gets cropped.</div>' +
        '<label>Read Time</label>' +
        '<input type="text" name="readTime" value="' + (editing ? esc(editing.readTime) : '') + '" placeholder="e.g. 4 min read">' +
        '<label>Well, WTF is this? (short TL;DR)</label>' +
        '<textarea name="tldr" style="min-height:80px;" placeholder="One or two sentences summing up the story.">' + (editing ? esc(editing.tldr || '') : '') + '</textarea>' +
        '<label>Body</label>' +
        '<textarea name="body" required placeholder="Separate paragraphs with a blank line.">' + (editing ? esc(editing.body.join('\n\n')) : '') + '</textarea>' +
        '<div style="display:flex; gap:12px;">' +
          '<button type="submit" class="btn btn-primary" id="save-btn">Save</button>' +
          '<button type="button" class="btn btn-outline" onclick="WTF.cancelForm()">Cancel</button>' +
        '</div>' +
        '<div class="publish-status" id="publish-status"></div>' +
      '</form>';
  }

  function adminHtml() {
    if (!currentUser) return '<div class="admin-wrap"><p class="dek">You need to <a href="#login" style="color:var(--accent-text); text-decoration:underline;">log in</a> to edit articles.</p></div>';
    return '' +
      '<div class="admin-wrap">' +
        '<a href="#home" class="see-all" style="display:inline-block; margin-bottom:24px;">&larr; Back to the Feed</a>' +
        '<h1 class="headline" style="font-size:clamp(28px, 3.4vw, 40px); margin-bottom:12px;">Edit Articles</h1>' +
        '<p class="dek" style="margin-bottom:24px;">Signed in as ' + esc(currentUser.email) + '. Changes go live for everyone immediately.</p>' +
        (window.__WTF_SHOW_FORM__ ? adminFormHtml() : '<button class="btn btn-primary" onclick="WTF.startNew()">+ New Article</button>') +
        (window.__WTF_SHOW_FORM__ ? '' : '<div style="margin-top:32px;">' + adminListHtml() + '</div>') +
      '</div>';
  }

  function renderNav() {
    var right = document.getElementById('utility-right');
    right.innerHTML = currentUser
      ? '<span class="eyebrow" style="color:var(--fg-muted);">' + esc(currentUser.email) + '</span>'
      : '';
    var authLink = document.getElementById('nav-auth-link');
    var navRow = document.getElementById('nav-row');
    var existingAdmin = document.getElementById('nav-admin-link');
    if (currentUser) {
      authLink.textContent = 'Log Out';
      authLink.onclick = function () { auth.signOut(); };
      if (!existingAdmin) {
        var adminLink = document.createElement('a');
        adminLink.href = '#admin';
        adminLink.className = 'nav-link';
        adminLink.id = 'nav-admin-link';
        adminLink.textContent = 'Edit';
        navRow.appendChild(adminLink);
      }
    } else {
      authLink.textContent = "Don't click this.";
      authLink.onclick = function () { window.location.hash = 'login'; };
      if (existingAdmin) existingAdmin.remove();
    }
  }

  function render() {
    renderNav();
    var hash = window.location.hash.replace('#', '') || 'home';
    var app = document.getElementById('app');
    if (hash === 'login') {
      app.innerHTML = currentUser ? homeHtml() : loginHtml();
      if (!currentUser) wireLoginForm();
    } else if (hash === 'admin') {
      app.innerHTML = adminHtml();
      if (currentUser) wireAdminForm();
    } else if (hash.indexOf('article-') === 0) {
      var a = findArticle(hash.slice('article-'.length));
      app.innerHTML = a ? articleHtml(a) : notFoundHtml();
    } else if (hash.indexOf('category-') === 0) {
      var cat = hash.slice('category-'.length);
      app.innerHTML = CAT_LABEL[cat] ? categoryPageHtml(cat) : notFoundHtml();
    } else {
      app.innerHTML = homeHtml();
    }
    window.scrollTo(0, 0);
  }

  function wireLoginForm() {
    var form = document.getElementById('login-form');
    if (!form) return;
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var email = form.email.value.trim();
      var password = form.password.value;
      auth.signInWithEmailAndPassword(email, password).then(function () {
        window.location.hash = 'admin';
      }).catch(function (err) {
        document.getElementById('login-error').textContent = err.message;
      });
    });
  }

  function wireAdminForm() {
    var form = document.getElementById('article-form');
    if (!form) return;
    form.addEventListener('submit', WTF.saveForm);
  }

  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  window.WTF = {
    startNew: function () { editingId = null; window.__WTF_SHOW_FORM__ = true; render(); },
    startEdit: function (id) { editingId = id; window.__WTF_SHOW_FORM__ = true; render(); },
    cancelForm: function () { editingId = null; window.__WTF_SHOW_FORM__ = false; render(); },
    deleteRequest: function (id) { pendingDeleteId = id; render(); },
    deleteCancel: function () { pendingDeleteId = null; render(); },
    deleteConfirm: function () {
      var id = pendingDeleteId;
      pendingDeleteId = null;
      db.collection('articles').doc(id).delete().catch(function (err) { alert('Could not delete: ' + err.message); });
    },
    saveForm: async function (ev) {
      ev.preventDefault();
      var form = ev.target;
      var statusEl = document.getElementById('publish-status');
      var saveBtn = document.getElementById('save-btn');
      var headline = form.headline.value.trim();
      var dek = form.dek.value.trim();
      var byline = form.byline.value.trim();
      var category = form.category.value;
      var isHero = form.hero.checked;
      var bodyRaw = form.body.value.trim();
      var body = bodyRaw.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
      if (!headline || !byline || body.length === 0) {
        alert('Please fill in a headline, byline, and at least one paragraph of body text.');
        return;
      }
      saveBtn.disabled = true;
      statusEl.textContent = 'Saving…';
      try {
        var imageUrl = editingId ? (findArticle(editingId) || {}).image || null : null;
        var file = form.image.files[0];
        if (file) {
          statusEl.textContent = 'Processing image…';
          imageUrl = await fileToDataUrl(file);
          if (imageUrl.length > 700000) {
            statusEl.textContent = '';
            saveBtn.disabled = false;
            alert('That image is too large (article data must stay under ~1MB total). Please use a smaller or more compressed image.');
            return;
          }
        }
        var wordCount = body.join(' ').split(/\s+/).length;
        var readTime = form.readTime.value.trim() || (Math.max(1, Math.round(wordCount / 200)) + ' min read');
        var data = {
          headline: headline, dek: dek, byline: byline, category: category,
          body: body, image: imageUrl, readTime: readTime,
          imagePosition: form.imagePosition.value, tldr: form.tldr.value.trim()
        };
        var docId = editingId;
        if (editingId) {
          await db.collection('articles').doc(editingId).update(data);
        } else {
          data.date = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          var ref = await db.collection('articles').add(data);
          docId = ref.id;
        }
        if (isHero) {
          await db.collection('settings').doc('hero').set({ articleId: docId });
        } else if (HERO_ID === docId) {
          await db.collection('settings').doc('hero').set({ articleId: null });
        }
        editingId = null;
        window.__WTF_SHOW_FORM__ = false;
        render();
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        saveBtn.disabled = false;
      }
    }
  };

  CATS.forEach(function (cat) {
    var link = document.createElement('a');
    link.href = '#category-' + cat;
    link.className = 'nav-link';
    link.textContent = CAT_LABEL[cat];
    document.getElementById('nav-row').appendChild(link);
  });

  window.addEventListener('hashchange', render);

  auth.onAuthStateChanged(function (user) {
    currentUser = user;
    render();
  });

  db.collection('articles').orderBy('createdAt', 'desc').onSnapshot(function (snapshot) {
    ARTICLES = snapshot.docs.map(function (doc) {
      var d = doc.data();
      d.id = doc.id;
      return d;
    });
    loading = false;
    render();
  }, function (err) {
    loading = false;
    console.error('articles snapshot error', err);
    render();
  });

  db.collection('settings').doc('hero').onSnapshot(function (doc) {
    HERO_ID = doc.exists ? doc.data().articleId : null;
    render();
  });

  render();
})();
</script>
</body>
</html>
